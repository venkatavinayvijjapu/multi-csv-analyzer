[pytest]
# Root discovery — all tests are in the tests/ folder
testpaths = tests

# Make the workspace root importable so tests can do: import session_store, from core.xxx import ...
pythonpath = .

# Verbose output + short tracebacks by default
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings

# Markers
markers =
    unit: fast unit tests (no I/O, no LLM)
    integration: tests that spin up the FastAPI TestClient
    slow: tests that take more than 5 seconds (e.g. sandbox timeout tests)

# Asyncio mode for pytest-asyncio
asyncio_mode = auto
